[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-probe"
version = "0.1.0"
description = "A streaming reverse proxy and per-session model call recorder for Codex"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["aiohttp==3.14.5", "multidict==7.2.1", "yarl==1.25.1"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
